name: zoo-visit-guide

# 완전 독립 구성입니다. Postgres/Redis/MCP 서버까지 전부 이 파일 안에서 띄우고
# 한 네트워크로 묶기 때문에, 이 저장소와 Docker만 있으면 사내망 접속 없이도
# 전체가 뜹니다 (OPENAI_API_KEY만 채우면 APP_MODE=openai로 실제 LLM 응답 가능).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: zoo
      POSTGRES_PASSWORD: zoo
      POSTGRES_DB: zoo
    volumes:
      - zoo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoo -d zoo"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  mcp_server:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    # backend/.env를 그대로 쓴다 (mcp_server도 backend.app.core.config의 Settings로
    # MCP_HOST/MCP_PORT를 읽는다). 컨테이너 안에서는 0.0.0.0으로 바인딩해야
    # 다른 컨테이너(backend)에서 접속할 수 있다.
    env_file: ./backend/.env
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8100
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: ./backend/.env
    environment:
      # backend/.env의 값(사내망 IP·원격 서버)은 로컬 개발용이다. 도커 네트워크
      # 안에서는 서비스명으로 서로를 찾도록 여기서 덮어쓴다.
      DATABASE_URL: postgresql://zoo:zoo@postgres:5432/zoo
      REDIS_URL: redis://redis:6379/0
      MCP_SERVER_URL: http://mcp_server:8100/mcp
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp_server:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file: ./frontend/.env
    environment:
      # frontend/.env의 외부 주소 대신 도커 네트워크 안에서는 서비스명으로 접근한다.
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  zoo_postgres_data:
