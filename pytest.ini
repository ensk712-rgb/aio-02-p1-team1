[pytest]
pythonpath = .
asyncio_mode = auto
; Windows에서 %LOCALAPPDATA%\Temp\pytest-of-<user> 폴더의 ACL이 깨져서(소유자 계정으로도
; 접근 불가) tmp_path 픽스처가 PermissionError로 죽는 환경이 있다. 프로젝트 안의 임시
; 디렉터리를 basetemp로 강제 지정해 그 폴더를 아예 건드리지 않도록 우회한다.
addopts = --basetemp=.pytest_tmp
testpaths = tests
python_files = test_*.py
markers =
    integration: 실제 MCP/Backend 프로세스가 필요한 로컬 연결 테스트
    live: 실제 LLM(OPENAI_API_KEY)이 필요한 시연 테스트
    policy: Agent policy and safety tests.
